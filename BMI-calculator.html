
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculator</title>

    <style>
       * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .container {
            width: 100%;
            max-width: 400px;
            padding: 25px;
            background-color: rgb(1, 1, 24);
            border-radius: 18px;
            box-shadow: 0 10px 35px black;
        }

        h1 {
            text-align: center;
            color: cyan
        }

        label {
            display: block;
            margin: 16px 0 7px;
            font-weight: bold;
        }

        .field {
            display: flex;
            gap: 8px;
        }

        input[type="number"], select {
            width: 100%;
            min-width: 0;
            padding: 12px;
            border: 1px solid rgb(64, 64, 94);
            border-radius: 8px;
            background-color: rgb(1, 1, 26);
            color: white;
            font-size: 15px;
        }

        .gender {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            margin-top: 10px;
        }

        .gender label {
            margin: 0;
            font-weight: normal;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 13px;
            border: none;
            border-radius: 999px;
            background: cyan;
            color: rgb(4, 53, 53);
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: rgb(72, 168, 168);
        }

        #Result {
            margin-top: 20px;
            padding: 14px;
            border-radius: 999px;
            background-color: rgb(1, 1, 17);
            text-align: center;
            line-height: 1.8;
            overflow-wrap: anywhere;
        }

        .note {
            margin-top: 15px;
            font-size: 12px;
            color: whitesmoke;
            line-height: 1.5;
    }
    </style>
</head>

<body>

<div class="container">

    <h1>BMI Calculator</h1>

    <label for="age">Age (years)</label>
    <input type="number" id="age" placeholder="Enter your age"
           min="1"max="120">

    <label>Gender</label>
    <div class="gender">
        <label>
            <input type="radio" name="gender" value="male">
            Male
        </label>

        <label>
            <input type="radio" name="gender" value="female">
            Female
        </label>

        <label>
            <input type="radio" name="gender" value="other">
            Other
        </label>

        <label>
            <input type="radio" name="gender" value="prefer">
            Prefer not to say
        </label>
    </div>

    <label for="Height">Height</label>
    <div class="field">
        <input type="number" id="Height" placeholder="Enter height"
               min=
               "0">

        <select id="heightUnit">
            <option value="cm">cm</option>
            <option value="m">Metres</option>
            <option value="in">Inches</option>
        </select>
    </div>

    <label for="weight">Weight</label>
    <div class="field">
        <input type="number" id="weight" placeholder="Enter weight"
               min="0">

        <select id="weightUnit">
            <option value="kg">kg</option>
            <option value="g">Grams</option>
            <option value="lb">Pounds (lb)</option>
        </select>
    </div>

    <button id="btn">Calculate BMI</button>

    <div id="Result">
    </div>

</div>

<script>
document.getElementById("btn").onclick = function() {
    let age = Number(document.getElementById("age").value);
    let height = Number(document.getElementById("Height").value);
    let weight = Number(document.getElementById("weight").value);
    let heightUnit = document.getElementById("heightUnit").value;
    let weightUnit = document.getElementById("weightUnit").value;
    let genderElement = document.querySelector(
        'input[name="gender"]:checked'
    );
    let result = document.getElementById("Result");
    if (
        document.getElementById("age").value === "" ||
        document.getElementById("Height").value === "" ||
        document.getElementById("weight").value === "" ||
        age < 1 || age > 120 ||
        height <= 0 || weight <= 0 ||
        !Number.isFinite(height) ||
        !Number.isFinite(weight) ||
        !genderElement
    ) {
        result.textContent =
            "Please enter valid details and select a gender option.";
        return;
    }
    if (heightUnit === "cm") {
        height = height / 100;
    }
    else if (heightUnit === "in") {
        height = height * 0.0254;
    }
   if (weightUnit === "g") {
        weight = weight / 1000;
    }
    else if (weightUnit === "lb") {
        weight = weight * 0.45359237;
    }
   let bmi = weight / (height * height);

    if (!Number.isFinite(bmi) || bmi <= 0) {
        result.textContent = "Please check your height and weight.";
        return;
    }
    let message;
        if (bmi < 18.5) {
            message = "Underweight";
        }
        else if (bmi < 25) {
            message = "Normal range";
        }
        else if (bmi < 30) {
            message = "Overweight";
        }
        else {
            message = "Obesity range";
        }

        result.innerHTML =
            "Your BMI: <strong>" + bmi.toFixed(2) +
            "</strong><br>Category: " + message;
    };
</script>

</body>
</html>
